<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QuoteSnap AI: WhatsApp inquiry to GST quote in 30 seconds</title>
    <meta name="description" content="Turn WhatsApp messages, voice notes and photos of site notes into accurate Indian GST quotations in seconds. Built for Indian small businesses." />
    <meta name="theme-color" content="#14203a" />
    <meta property="og:title" content="QuoteSnap AI: WhatsApp inquiry to GST quote in 30 seconds" />
    <meta property="og:description" content="Paste a message, snap a site note or forward a voice note. QuoteSnap prices it from your rate card, gets the GST right, and writes the WhatsApp reply." />

    <script>
      // Apply the saved or system theme before first paint (no flash).
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('qs2_theme') || 'null');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>QuoteSnap needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
